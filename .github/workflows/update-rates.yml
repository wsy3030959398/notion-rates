name: Update Notion Exchange Rates

on:
  schedule:
    # UTC 0点 = 北京时间早上8点，每天跑一次
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python update_rates.py

      - name: Record run timestamp (keeps repo active, prevents 60-day auto-disable)
        run: echo "Last run: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last_run.txt

      - name: Commit keepalive marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "chore: keepalive $(date -u +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
